services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ENABLE_PLATFORM_DOWNLOADS: ${ENABLE_PLATFORM_DOWNLOADS:-true}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      MAX_IMAGE_UPLOAD_BYTES: ${MAX_IMAGE_UPLOAD_BYTES:-20971520}
      MAX_MEDIA_OUTPUT_BYTES: ${MAX_MEDIA_OUTPUT_BYTES:-209715200}
    ports:
      - "8000:8000"
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
